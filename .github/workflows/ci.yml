name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/platform
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  SITE_URL: http://localhost:3000
  ADMIN_EMAIL: owner@example.com
  ADMIN_PASSWORD: ci-password-1234

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed
        run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - run: npm run build
      - name: Render every screen (server)
        run: |
          npm start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          npm run render-check
      - name: Reference docs are up to date
        run: npm run gen-docs && git diff --exit-code docs/reference

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
